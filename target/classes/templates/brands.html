<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Brands - NileMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: nav('brands')}"></div>

<div class="container">
    <div class="page-header">
        <h1 class="page-title">Brands</h1>
        <a th:href="@{/brands/new}" class="btn btn-primary">+ Add Brand</a>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Slug</th>
                <th>Active</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(brands)}">
                <td colspan="3" style="text-align: center; color: #64748b; padding: 2rem;">No brands available.</td>
            </tr>
            <tr th:each="brand : ${brands}">
                <td th:text="${brand.name}" style="font-weight: 600;"></td>
                <td th:text="${brand.slug}"></td>
                <td>
                    <span th:if="${brand.active}" class="badge badge-yes">Yes</span>
                    <span th:unless="${brand.active}" class="badge badge-no">No</span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
