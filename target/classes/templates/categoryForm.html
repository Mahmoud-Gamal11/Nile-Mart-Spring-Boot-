<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Category - NileMart</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: nav('categories')}"></div>

<div class="container">
    <div class="form-card">
        <h2 style="margin-bottom: 1.5rem; color: #1e293b;">Add New Category</h2>

        <form th:action="@{/categories}" th:object="${category}" method="post">
            <div class="form-group">
                <label for="name">Name</label>
                <input id="name" type="text" th:field="*{name}" class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                <span class="error-text" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="form-group">
                <label for="slug">Slug</label>
                <input id="slug" type="text" th:field="*{slug}" class="form-control" th:classappend="${#fields.hasErrors('slug')} ? 'is-invalid' : ''" placeholder="e.g. mobile-phones">
                <span class="error-text" th:if="${#fields.hasErrors('slug')}" th:errors="*{slug}"></span>
            </div>

            <div class="form-group">
                <label for="parentSlug">Parent Category</label>
                <select id="parentSlug" th:field="*{parentSlug}" class="form-control" th:classappend="${#fields.hasErrors('parentSlug')} ? 'is-invalid' : ''">
                    <option value="">None (top level)</option>
                    <option th:each="p : ${topLevelCategories}" th:value="${p.slug}" th:text="${p.name}"></option>
                </select>
                <span class="error-text" th:if="${#fields.hasErrors('parentSlug')}" th:errors="*{parentSlug}"></span>
            </div>

            <div class="form-group">
                <label for="displayOrder">Display Order</label>
                <input id="displayOrder" type="number" min="0" th:field="*{displayOrder}" class="form-control" th:classappend="${#fields.hasErrors('displayOrder')} ? 'is-invalid' : ''">
                <span class="error-text" th:if="${#fields.hasErrors('displayOrder')}" th:errors="*{displayOrder}"></span>
            </div>

            <div class="form-group">
                <label class="form-checkbox">
                    <input type="checkbox" th:field="*{active}">
                    <span>Active</span>
                </label>
                <span class="error-text" th:if="${#fields.hasErrors('active')}" th:errors="*{active}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save category</button>
                <a th:href="@{/categories}" class="btn btn-secondary">Back to categories</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
